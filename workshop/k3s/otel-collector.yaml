clusterReceiver:
  config:
    processors: {}
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, batch]
          exporters: [signalfx]
  eventsEnabled: true
  k8sObjects:
    - name: events
      mode: watch
      namespaces: [default, apache, loadgen, splunk]
    - name: pods
      mode: watch
      namespaces: [default, apache, loadgen, splunk]

agent:
  extraEnvs:
    - name: WORKSHOP_ENVIRONMENT
      valueFrom:
        secretKeyRef:
          name: workshop-secret
          key: env

  config:
    receivers:
      receiver_creator:
        receivers:
          nginx:
            rule: type == "port" && pod.name matches "nginx" && port == 8082
            config:
              endpoint: 'http://`endpoint`/nginx_status'
          mysql/workshop:
            rule: type == "port" && pod.name matches "mysql" && port == 3306
            config:
              tls:
                insecure: true
              endpoint: '`endpoint`'
              username: root
              password: root
              database: LxvGChW075
          mysql/petclinic:
            rule: type =="port" && pod.name matches "petclinic-db" && port == 3306
            config:
              tls:
                insecure: true
              endpoint: '`endpoint`'
              username: root
              password: petclinic
              database: petclinic
          redis/workshop:
            rule: type == "port" && pod.name matches "redis-cart" && port == 6379
            config:
              endpoint: '`endpoint`'

    processors:
      # FIX: use OTTL expressions (list of drop conditions) instead of the old
      # include/exclude map syntax. Spans matching ANY condition are dropped.
      # Only DB CLIENT spans pass through to the spanmetrics connector.
      filter/db_spans_only:
        error_mode: ignore
        traces:
          span:
            - 'attributes["db.system"] == nil'
            - 'kind != SPAN_KIND_CLIENT'

    exporters:
      otlphttp/traces:
        # FIX: hardcoded realm (us1) to match Helm chart — SPLUNK_REALM is not
        # injected as an env var. Using SPLUNK_OBSERVABILITY_ACCESS_TOKEN which
        # IS available in the agent pod.
        traces_endpoint: https://ingest.us1.signalfx.com/v2/trace/otlp
        headers:
          X-SF-Token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s]
        dimensions:
          - name: db.system
          - name: db.operation
          - name: db.sql.table
          - name: sf_service
        metrics_flush_interval: 60s

    extensions:
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      pipelines:
        # Unchanged — all spans to Splunk APM
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp/traces]

        # DB CLIENT spans only → spanmetrics connector
        traces/db_metrics:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, filter/db_spans_only, batch]
          exporters: [spanmetrics]

        # Unchanged — host/k8s metrics to Splunk
        metrics:
          receivers: [hostmetrics, otlp, receiver_creator]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [signalfx]

        # spanmetrics output → Splunk as custom metrics
        metrics/spanmetrics:
          receivers: [spanmetrics]
          exporters: [signalfx]

logsCollection:
  extraFileLogs:
    filelog/syslog:
      include: [/var/log/syslog]
      include_file_path: true
      include_file_name: false
      resource:
        com.splunk.source: /var/log/syslog
        host.name: 'EXPR(env("K8S_NODE_NAME"))'
        com.splunk.sourcetype: syslog
    filelog/auth_log:
      include: [/var/log/auth.log]
      include_file_path: true
      include_file_name: false
      resource:
        com.splunk.source: /var/log/auth.log
        host.name: 'EXPR(env("K8S_NODE_NAME"))'
        com.splunk.sourcetype: auth_log
